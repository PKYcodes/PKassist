name: PKassist v3 Ultra Auto-Version & Signed Release CI

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Calculate Next Version Automatically
        id: version
        run: |
          VERSION_CODE=$((300 + GITHUB_RUN_NUMBER))
          VERSION_NAME="3.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Building PKassist Ultra v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Generate Release Keystore for V1+V2 APK Signing
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias pkassist_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pkassist123 -keypass pkassist123 \
            -dname "CN=PKassist, OU=RVGroup, O=RVGroupLtd, L=Muzaffarpur, S=Bihar, C=IN"

      - name: Prepare Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

      - name: Build Signed Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${VERSION_CODE} \
            -PversionName=${VERSION_NAME} \
            -PgeminiApiKey="${GEMINI_API_KEY}"

      - name: Copy Signed APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk PKassist-v${VERSION_NAME}.apk

      - name: Create GitHub Release & Upload Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "PKassist Ultra v${{ steps.version.outputs.version_name }} (Gemini Glass Edition)"
          body: |
            ### PKassist Ultra v${{ steps.version.outputs.version_name }} — Gemini Glass & Voice Unlock Edition
            - **Gemini-Style Glassmorphism Bottom Popup**: Sleek frosted glass overlay with neon gradient border, live voice transcript, and quick chips over any app.
            - **24/7 Background & Lock-Screen Listening**: Listens continuously in background and on the lock screen (wake word `"Hey PK"` or direct voice commands).
            - **Voice PIN / Password Device Unlock**: Speak your PIN/Password (`"unlock 1234"` or `"PK unlock"`) to wake the screen, swipe up the lock screen, and auto-enter your PIN via Accessibility.
            - **Extreme Hinglish & Screen-Context AI Engine**: 30+ offline & online actions including WhatsApp end-to-end messaging, Screen reading, Fuzzy button clicks, Alarms, Calls, YouTube, Volume, and System controls.
            
            *— powered by RV GROUP —*
          files: PKassist-v${{ steps.version.outputs.version_name }}.apk
          draft: false
          prerelease: false
