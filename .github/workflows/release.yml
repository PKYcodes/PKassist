name: PKassist Auto-Version & Release CI

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Calculate Next Version Automatically
        id: version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Building PKassist v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

      - name: Build Release APK with Auto-Version
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${VERSION_CODE} \
            -PversionName=${VERSION_NAME} \
            -PgeminiApiKey="${GEMINI_API_KEY}"

      - name: Rename APK for Distribution
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PKassist-v${VERSION_NAME}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "PKassist v${{ steps.version.outputs.version_name }}"
          body: |
            ### PKassist v${{ steps.version.outputs.version_name }} Auto-Release
            - **Commit**: `${{ github.sha }}`
            - **Message**: ${{ github.event.head_commit.message }}
            - **Auto-Update**: Existing PKassist installations will automatically detect this release, notify the user, and download `PKassist-v${{ steps.version.outputs.version_name }}.apk`.
            
            *— powered by RV GROUP —*
          files: PKassist-v${{ steps.version.outputs.version_name }}.apk
          draft: false
          prerelease: false
